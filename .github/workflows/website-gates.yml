name: Website gates

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: website-gates-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build-and-verify:
    name: Build and verify
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Der Formulardienst hat eigene Abhaengigkeiten. Ohne sie liefe der
      # Laufzeittest unten ins Leere — und ein Tor, das nie rot war, ist
      # nicht bestanden, sondern ungeprueft.
      - name: Install form service dependencies
        run: npm ci --prefix api

      - name: Build
        run: npm run build

      - name: Verify generated site
        run: npm run verify

      # Startet api/server.mjs wirklich und misst Netzverkehr, Antwort und
      # Protokoll (PXK-30). Braucht kein Netz und keine Zugangsdaten.
      - name: Verify form runtime contract
        run: npm run pruefe:formular
